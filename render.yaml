services:
  - type: web
    name: thundocs-trader-api
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: SYMBOL
        value: BTCUSDT
      - key: KL_INTERVAL
        value: 15m
      - key: LOOP_SECONDS
        value: "900"
      - key: THUNDOC_BINANCE_KEY
        sync: false
      - key: THUNDOC_BINANCE_SECRET
        sync: false
    healthCheckPath: /api/state
